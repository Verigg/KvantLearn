<a href="{% url 'catalog:lesson_detail' slug=material.slug pk=lesson.pk %}"
   class="group px-5 py-3.5 flex items-center justify-between hover:bg-slate-50 transition text-sm">
  <div class="flex items-center space-x-3 truncate mr-3">
    <div class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-semibold
      {% if active_lesson_id == lesson.pk %}
        bg-indigo-600 text-white
      {% else %}
        bg-slate-100 text-slate-500 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition
      {% endif %}">
      {{ forloop.counter|default:lesson.order }}
    </div>
    
    <span class="truncate font-medium {% if active_lesson_id == lesson.pk %}text-indigo-600 font-semibold{% else %}text-slate-700 group-hover:text-slate-900{% endif %}">
      {{ lesson.title }}
    </span>
  </div>

  <div class="flex items-center space-x-2 text-slate-400 group-hover:text-indigo-600 transition flex-shrink-0 text-xs">
    {% if lesson.video_url %}
      <span title="Содержит видео"><i data-lucide="video" class="w-3.5 h-3.5"></i></span>
    {% endif %}
    {% if lesson.image %}
      <span title="Содержит иллюстрации"><i data-lucide="image" class="w-3.5 h-3.5"></i></span>
    {% endif %}
    <i data-lucide="chevron-right" class="w-4 h-4 ml-1 text-slate-300 group-hover:text-indigo-500 transition"></i>
  </div>
</a>
